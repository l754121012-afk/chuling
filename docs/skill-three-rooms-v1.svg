<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", sans-serif; }
      .room { fill: #f2efe6; stroke: #26303c; stroke-width: 3; }
      .dark { fill: #dfe7ee; stroke: #26303c; stroke-width: 2; }
      .flow { stroke: #f4a261; stroke-width: 5; fill: none; stroke-dasharray: 12 8; }
      .flowtext { fill: #a44612; font-size: 18px; font-weight: bold; }
      .note { fill: #fff2cf; stroke: #26303c; stroke-width: 1; font-size: 14px; }
      .title { font-size: 28px; font-weight: bold; fill: #24303c; }
      .badge { font-size: 22px; font-weight: bold; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#9db2c4"/>
  <text x="40" y="45" class="title">三间能力试炼白盒 · 悠悠球门铃 → 卷尺货架巷 → 修正带仓库 Boss</text>

  <!-- Room 1 -->
  <rect x="40" y="90" width="330" height="600" rx="10" class="room"/>
  <rect x="80" y="140" width="250" height="90" class="dark"/>
  <rect x="80" y="430" width="250" height="90" class="dark"/>
  <rect x="80" y="240" width="250" height="180" class="room"/>
  <text x="205" y="125" text-anchor="middle" class="badge">1 门铃前厅</text>
  <text x="205" y="180" text-anchor="middle">高墙铃 A</text>
  <circle cx="205" cy="200" r="22" fill="#ffd166" stroke="#26303c" stroke-width="2"/>
  <text x="205" y="480" text-anchor="middle">高墙铃 B</text>
  <circle cx="205" cy="500" r="22" fill="#8ef0c8" stroke="#26303c" stroke-width="2"/>
  <text x="205" y="330" text-anchor="middle">悠悠球敲对铃开门</text>
  <text x="205" y="365" text-anchor="middle">口哨怪横弹</text>
  <rect x="330" y="360" width="40" height="100" fill="#e63946"/>
  <text x="350" y="340" text-anchor="middle">门→</text>

  <!-- Room 2 -->
  <rect x="400" y="90" width="380" height="600" rx="10" class="room"/>
  <rect x="450" y="130" width="100" height="520" class="dark"/>
  <rect x="590" y="130" width="120" height="250" class="dark"/>
  <rect x="740" y="130" width="20" height="520" class="dark"/>
  <text x="590" y="115" text-anchor="middle" class="badge">2 卷尺货架巷</text>
  <line x1="470" y1="620" x2="620" y2="300" class="flow"/>
  <line x1="620" y1="300" x2="740" y2="300" class="flow"/>
  <line x1="740" y1="300" x2="740" y2="620" class="flow"/>
  <circle cx="470" cy="620" r="18" fill="#4cc9f0"/>
  <circle cx="620" cy="300" r="18" fill="#4cc9f0"/>
  <circle cx="740" cy="620" r="18" fill="#4cc9f0"/>
  <text x="470" y="650" text-anchor="middle">钩爪起点</text>
  <text x="620" y="270" text-anchor="middle">吊环摆荡</text>
  <text x="740" y="660" text-anchor="middle">出口</text>
  <text x="520" y="500" text-anchor="middle" class="flowtext">下段修正带洪流</text>
  <text x="520" y="530" text-anchor="middle">滚轮怪压路</text>
  <circle cx="610" cy="460" r="26" fill="#e76f51"/>
  <path d="M 580 460 L 640 460 M 610 440 L 610 480" stroke="#fff" stroke-width="4"/>

  <!-- Room 3 -->
  <rect x="810" y="90" width="350" height="600" rx="10" class="room"/>
  <rect x="830" y="130" width="310" height="80" class="dark"/>
  <text x="985" y="105" text-anchor="middle" class="badge">3 修正带仓库 Boss</text>
  <rect x="850" y="250" width="270" height="180" rx="8" fill="#ffe9b8" stroke="#26303c" stroke-width="2"/>
  <text x="985" y="300" text-anchor="middle">店长鬼 三阶段</text>
  <circle cx="900" cy="360" r="34" fill="#f3efe7" stroke="#26303c" stroke-width="2"/>
  <circle cx="890" cy="350" r="5" fill="#26303c"/>
  <circle cx="910" cy="350" r="5" fill="#26303c"/>
  <text x="1060" y="300" text-anchor="middle">档案柜出口</text>
  <path d="M 890 470 L 1080 470 L 1080 590 L 890 590 Z" fill="none" stroke="#8ef0c8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="985" y="520" text-anchor="middle">修正带压鬼 / 钩爪撞电扇</text>
  <text x="985" y="560" text-anchor="middle">悠悠球打断冲刺</text>

  <path d="M 370 410 L 400 410" stroke="#26303c" stroke-width="8"/>
  <path d="M 780 410 L 810 410" stroke="#26303c" stroke-width="8"/>
  <text x="205" y="690" text-anchor="middle" class="note">新怪：口哨怪（弹道留迹）</text>
  <text x="590" y="690" text-anchor="middle" class="note">新怪：滚轮怪 / 卷尺蜂</text>
  <text x="985" y="690" text-anchor="middle" class="note">Boss：店长鬼三阶段弹幕</text>
</svg>
