<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffd166"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#15161a; }
    .panel { fill:#f7f1e2; stroke:#5a4d37; stroke-width:2; }
    .h { font: bold 27px "Microsoft YaHei",sans-serif; fill:#2b2118; }
    .t { font: 17px "Microsoft YaHei",sans-serif; fill:#4b4134; }
    .s { font: 14px "Microsoft YaHei",sans-serif; fill:#4b4134; }
    .gold { font: bold 18px "Microsoft YaHei",sans-serif; fill:#b7791f; }
    .red { fill:#c94f3d; }
  </style>
  <rect class="bg" width="1600" height="1500"/>
  <text x="40" y="46" font-size="32" font-family="Microsoft YaHei" font-weight="700" fill="#ffe9b8">90 分钟完整故事循环 · 视觉示意（重做稿）</text>
  <text x="40" y="82" font-size="17" font-family="Microsoft YaHei" fill="#d8cbb4">故事：《两支圆珠笔》 · 玩法借用 Outer Wilds/Hitman/Obra Dinn · 三段关卡全部服务同一真相</text>

  <!-- Panel 1: story route -->
  <g>
    <rect x="34" y="110" width="1540" height="560" class="panel"/>
    <text x="60" y="152" class="h">A · 关卡链：每关给故事一块拼图</text>

    <!-- Hub -->
    <g>
      <rect x="80" y="210" width="220" height="180" rx="12" fill="#efe3cc" stroke="#8a6d3b" stroke-width="3"/>
      <text x="190" y="250" class="gold" text-anchor="middle">百元店后屋</text>
      <text x="190" y="285" class="t" text-anchor="middle">接“值日鬼求助单”</text>
      <text x="190" y="310" class="s" text-anchor="middle">看到旧照片一半</text>
      <text x="190" y="335" class="s" text-anchor="middle">债务与单子板</text>
    </g>
    <line x1="310" y1="300" x2="370" y2="300" stroke="#ffd166" stroke-width="3" marker-end="url(#ar)"/>

    <!-- Stage 1 classroom -->
    <g>
      <rect x="380" y="180" width="300" height="230" rx="12" fill="#f2e7cf" stroke="#7d5a33" stroke-width="3"/>
      <text x="530" y="215" class="gold" text-anchor="middle">01 值日教室</text>
      <text x="530" y="252" class="t" text-anchor="middle">玩法：观察心愿+潜行</text>
      <text x="530" y="278" class="s" text-anchor="middle">帮小满找回被没收的笔</text>
      <text x="530" y="300" class="s" text-anchor="middle">第一次双人结算/关系种子</text>
      <rect x="420" y="320" width="220" height="62" rx="8" fill="#fff0d0" stroke="#c94f3d"/>
      <text x="530" y="345" class="s" text-anchor="middle">新线索：笔芯里夹着纸条</text>
      <text x="530" y="366" class="s" text-anchor="middle">“别去旧保健室”</text>
    </g>
    <line x1="690" y1="300" x2="750" y2="300" stroke="#ffd166" stroke-width="3" marker-end="url(#ar)"/>

    <!-- Stage 2 detention -->
    <g>
      <rect x="760" y="150" width="370" height="300" rx="12" fill="#efe3cc" stroke="#8f2f24" stroke-width="4"/>
      <text x="945" y="190" class="gold" text-anchor="middle">02 禁闭室·第45次铃</text>
      <text x="945" y="225" class="t" text-anchor="middle">玩法：时间循环+日程观察</text>
      <text x="945" y="252" class="s" text-anchor="middle">程老师重复放学前45分钟</text>
      <text x="945" y="275" class="s" text-anchor="middle">粉笔声/电话/值日表改路线</text>
      <text x="945" y="298" class="s" text-anchor="middle">用检讨书保留每次循环的信息</text>
      <rect x="800" y="330" width="290" height="80" rx="8" fill="#f4d6d0" stroke="#8f2f24"/>
      <text x="945" y="358" class="s" text-anchor="middle">三循环后重写处罚记录</text>
      <text x="945" y="382" class="s" text-anchor="middle">发现程老师替人顶罪</text>
    </g>
    <line x1="1140" y1="300" x2="1200" y2="300" stroke="#ffd166" stroke-width="3" marker-end="url(#ar)"/>

    <!-- Stage 3 warehouse -->
    <g>
      <rect x="1210" y="170" width="320" height="250" rx="12" fill="#d9c7e8" stroke="#6a4e9b" stroke-width="4"/>
      <text x="1370" y="210" class="gold" text-anchor="middle" fill="#5d3a91">03 旧仓库·失火那晚</text>
      <text x="1370" y="245" class="t" text-anchor="middle">玩法：记忆回放+空间回溯</text>
      <text x="1370" y="272" class="s" text-anchor="middle">两支笔配对成为钥匙</text>
      <text x="1370" y="295" class="s" text-anchor="middle">真相：不是学生纵火</text>
      <text x="1370" y="318" class="s" text-anchor="middle">是旧电线短路，程老师背了锅</text>
      <rect x="1240" y="340" width="260" height="55" rx="8" fill="#fff" stroke="#5d3a91"/>
      <text x="1370" y="374" class="s" text-anchor="middle">小满与程老师互相原谅</text>
    </g>

    <rect x="90" y="420" width="1420" height="205" rx="14" fill="#2b2633" stroke="#9b5de5"/>
    <text x="120" y="460" font-size="19" font-family="Microsoft YaHei" font-weight="700" fill="#e6d8ff">为什么这一整条流程会“恍然大悟”</text>
    <text x="120" y="495" class="t" fill="#ffe9b8">第一阶段你以为只是在帮值日鬼：小动作、心愿、一支笔。</text>
    <text x="120" y="525" class="t" fill="#ffe9b8">第二阶段你以为只是在破解规则：程老师的循环、粉笔声、检讨书。</text>
    <text x="120" y="555" class="t" fill="#ffe9b8">第三阶段旧仓库把“心愿”“笔”“处罚”“火”合成一句话：小满没被处罚，程老师替她承担了一切。</text>
    <text x="120" y="590" class="s" fill="#d8cbb4">玩家最后才明白：第一关教你的“观察鬼的心愿”，第二关逼你“重写规则”，都是第三关真相的语法。</text>
  </g>

  <!-- Panel 2: detention spatial -->
  <g>
    <rect x="34" y="700" width="1540" height="420" class="panel"/>
    <text x="60" y="742" class="h">B · 禁闭室立体结构：循环如何改变空间</text>

    <!-- axonometric -->
    <g transform="translate(300,1120)">
      <!-- floor -->
      <polygon points="-220,100 220,100 150,-60 -150,-60" fill="#d8c7a6" stroke="#5a4d37"/>
      <!-- back wall -->
      <polygon points="-150,-60 150,-60 150,-210 -150,-210" fill="#ccd3d7" stroke="#59616e"/>
      <!-- left wall -->
      <polygon points="-220,100 -150,-60 -150,-210 -220,-50" fill="#a9b3b8" stroke="#59616e"/>
      <!-- right partial wall / records room -->
      <polygon points="150,-60 220,100 220,-50 150,-210" fill="#c3cbd0" stroke="#59616e"/>
      <!-- chalk board -->
      <rect x="-130" y="-190" width="100" height="80" fill="#5d6b5a" stroke="#2f3a30"/>
      <text x="-80" y="-142" font-size="12" fill="#e5ecd8" text-anchor="middle" font-family="Microsoft YaHei">值日表</text>
      <!-- desk blocks -->
      <g fill="#c39a6b" stroke="#7d5a33">
        <polygon points="-40,-30 -10,-15 -10,35 -40,20"/>
        <polygon points="-10,-15 30,-30 30,20 -10,35"/>
      </g>
      <!-- chair moved into line -->
      <rect x="-20" y="42" width="80" height="18" fill="#b56b4f" stroke="#7d3f2c"/>
      <!-- cabinet / tall -->
      <rect x="90" y="-90" width="45" height="75" fill="#8a6d3b" stroke="#57401f"/>
      <!-- vent -->
      <rect x="-100" y="70" width="130" height="18" fill="#4b4b50" stroke="#2c343d"/>
      <line x1="-95" y1="80" x2="25" y2="80" stroke="#2c343d"/>
    </g>

    <g transform="translate(760,770)">
      <text x="0" y="10" class="gold">循环变量</text>
      <text x="0" y="45" class="t">① 08:10 粉笔声：程老师离开禁闭桌</text>
      <text x="0" y="75" class="t">② 08:25 电话响：它冲向右档案室</text>
      <text x="0" y="105" class="t">③ 08:40 窗帘落下：旧办公室形成封闭角</text>
      <text x="0" y="145" class="s">玩家每轮保留一行检讨书，房间下一轮重新布置；档案柜可推、通风槽可钻、黑板可翻。</text>
    </g>
  </g>

  <!-- Panel 3: object clues -->
  <g>
    <rect x="34" y="1150" width="1540" height="320" class="panel"/>
    <text x="60" y="1192" class="h">C · 物件 = 故事密码</text>

    <g transform="translate(90,1230)">
      <rect width="330" height="190" rx="10" fill="#f2e7cf" stroke="#7d5a33"/>
      <text x="165" y="35" text-anchor="middle" class="gold">小满的圆珠笔</text>
      <text x="165" y="70" text-anchor="middle" class="t">第一关心愿道具</text>
      <text x="165" y="100" text-anchor="middle" class="s">笔芯纸条：别去旧保健室</text>
      <text x="165" y="130" text-anchor="middle" class="s">第三关成为记忆钥匙</text>
    </g>
    <g transform="translate(470,1230)">
      <rect width="330" height="190" rx="10" fill="#f2e7cf" stroke="#8f2f24"/>
      <text x="165" y="35" text-anchor="middle" class="gold">程老师的检讨书</text>
      <text x="165" y="70" text-anchor="middle" class="t">第二关每循环写一句</text>
      <text x="165" y="100" text-anchor="middle" class="s">最后一行被玩家重写</text>
      <text x="165" y="130" text-anchor="middle" class="s">“该被处罚的人不是它”</text>
    </g>
    <g transform="translate(850,1230)">
      <rect width="330" height="190" rx="10" fill="#efe3e6" stroke="#9b5de5"/>
      <text x="165" y="35" text-anchor="middle" class="gold">值日表 / 日程</text>
      <text x="165" y="70" text-anchor="middle" class="t">程老师只按铃声行动</text>
      <text x="165" y="100" text-anchor="middle" class="s">玩家用声音反向操控它</text>
      <text x="165" y="130" text-anchor="middle" class="s">玩法即“被规则困住”的叙事</text>
    </g>
    <g transform="translate(1230,1230)">
      <rect width="320" height="190" rx="10" fill="#dce9da" stroke="#3f7f5a"/>
      <text x="160" y="35" text-anchor="middle" class="gold">失火那晚</text>
      <text x="160" y="70" text-anchor="middle" class="t">不是任何学生的错</text>
      <text x="160" y="100" text-anchor="middle" class="s">旧电线短路，程老师背锅</text>
      <text x="160" y="130" text-anchor="middle" class="s">两支笔并排 = 真相闭合</text>
    </g>
  </g>

  <text x="40" y="1490" font-size="16" font-family="Microsoft YaHei" fill="#d8cbb4">本稿是确认方向稿，未开始实现；下一步再出更细的禁闭室循环分镜与互动单体设定。</text>
</svg>
