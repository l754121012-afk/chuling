<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e0a94e"/>
    </marker>
    <pattern id="hazard" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ffe9b8"/>
      <rect width="10" height="5" fill="#e63946"/>
    </pattern>
  </defs>
  <style>
    .bg { fill:#15161a; }
    .panel { fill:#f7f1e2; stroke:#5a4d37; stroke-width:2; }
    .sub { fill:#efe3cc; stroke:#8a6d3b; stroke-width:2; }
    .room { fill:#fff8e8; stroke:#5a4d37; stroke-width:3; }
    .room-f { fill:#f4ddd2; stroke:#8f2f24; stroke-width:3; }
    .room-b { fill:#dde7e8; stroke:#3f6d7a; stroke-width:3; }
    .room-m { fill:#e9dff2; stroke:#6a4e9b; stroke-width:3; }
    .h { font: bold 26px "Microsoft YaHei",sans-serif; fill:#2b2118; }
    .t { font: 15px "Microsoft YaHei",sans-serif; fill:#4b4134; }
    .s { font: 13px "Microsoft YaHei",sans-serif; fill:#4b4134; }
    .gold { font: bold 19px "Microsoft YaHei",sans-serif; fill:#b7791f; }
    .red { fill:#c94f3d; font-weight:700; }
    .route { fill:none; stroke:#e0a94e; stroke-width:3; stroke-dasharray:7 5; marker-end:url(#arr); }
    .route-v { fill:none; stroke:#9b5de5; stroke-width:3; stroke-dasharray:5 6; }
  </style>

  <rect class="bg" width="1600" height="1900"/>
  <text x="40" y="46" font-size="32" font-family="Microsoft YaHei" font-weight="700" fill="#ffe9b8">V100 · 禁闭室正式关西翼三层骨架</text>
  <text x="40" y="82" font-size="17" font-family="Microsoft YaHei" fill="#d8cbb4">方案 A：Dishonored 垂直潜入 + Hitman 房间功能 · 信息分层放置 · 每层至少一条绕行/钻入/向上路线</text>

  <!-- Legend and goal -->
  <g>
    <rect x="40" y="110" width="1520" height="190" class="panel"/>
    <text x="70" y="150" class="h">本关全局规则：第 45 次下课铃</text>
    <text x="70" y="186" class="t">08:00 门禁开启 -> 08:10 粉笔声把程老师引向保健室 -> 08:25 电话响把它引向档案室 -> 08:40 锅炉蒸汽喷发把它引下地下层。</text>
    <text x="70" y="220" class="t">关键物反馈：红笔 = 规则钥匙；拿到后处分记录可改写、出口锁定规则改变、程老师进入“批改暴走”状态，全图门/路线同步变化。</text>
    <rect x="70" y="242" width="240" height="40" rx="8" fill="url(#hazard)" stroke="#8f2f24"/>
    <text x="190" y="268" class="red" text-anchor="middle" font-size="15">三流解法都可通关</text>
    <text x="360" y="268" class="s">潜行/观察 = 真结局 · 戏耍连锁 = 高分 · 正面强攻 = 快但失去记录碎片</text>
  </g>

  <!-- 1F -->
  <g>
    <rect x="40" y="330" width="500" height="470" class="panel"/>
    <text x="70" y="376" class="h">1F · 保健室禁闭区</text>
    <text x="70" y="402" class="s">总目标：拿粉笔盒、红笔，用声音把它调离一层</text>
    <rect x="70" y="425" width="140" height="150" class="room-f"/>
    <text x="140" y="455" class="t" text-anchor="middle">值班室</text>
    <text x="140" y="480" class="s" text-anchor="middle">挂锁柜/门禁铃</text>
    <text x="140" y="500" class="s" text-anchor="middle">失物招领</text>
    <rect x="250" y="425" width="270" height="150" class="room-f"/>
    <text x="385" y="455" class="t" text-anchor="middle">保健室改造禁闭区</text>
    <text x="385" y="480" class="s" text-anchor="middle">粉笔盒 / 旧窗帘</text>
    <text x="385" y="500" class="s" text-anchor="middle">半透明隔断会重排</text>
    <rect x="70" y="610" width="450" height="170" class="room-m"/>
    <text x="295" y="650" class="t" text-anchor="middle">禁闭隔间迷宫</text>
    <text x="295" y="675" class="s" text-anchor="middle">可推挡板 / 桌洞 / 高窗</text>
    <text x="295" y="695" class="s" text-anchor="middle">墙上刻字：不许顶嘴</text>
    <path class="route" d="M140 575 L140 610 M385 575 L385 610 M150 610 L400 610"/>
    <text x="480" y="360" class="s" fill="#8f2f24">↑ 出口/二楼楼梯</text>
  </g>

  <!-- 2F -->
  <g>
    <rect x="570" y="330" width="500" height="470" class="panel"/>
    <text x="600" y="376" class="h">2F · 办公室与档案阁</text>
    <text x="600" y="402" class="s">总目标：值日表 + 处分记录 + 夹层笔帽</text>
    <rect x="600" y="425" width="210" height="150" class="room"/>
    <text x="705" y="455" class="t" text-anchor="middle">教师办公室</text>
    <text x="705" y="480" class="s" text-anchor="middle">值日表 / 红笔</text>
    <text x="705" y="500" class="s" text-anchor="middle">处分印章</text>
    <rect x="850" y="425" width="190" height="150" class="room"/>
    <text x="945" y="455" class="t" text-anchor="middle">资料室</text>
    <text x="945" y="480" class="s" text-anchor="middle">三份学生记录</text>
    <text x="945" y="500" class="s" text-anchor="middle">两份教师记录</text>
    <rect x="600" y="610" width="440" height="170" class="room-m"/>
    <text x="820" y="650" class="t" text-anchor="middle">档案阁夹层（可攀爬）</text>
    <text x="820" y="675" class="s" text-anchor="middle">活动梯 / 悬梁 / 通风口</text>
    <text x="820" y="695" class="s" text-anchor="middle">夹层藏着小满的笔帽</text>
    <path class="route-v" d="M705 575 L705 610 L700 610 M860 575 L860 610"/>
    <path class="route" d="M820 780 L980 780 L980 900 L1100 900"/>
    <text x="600" y="790" class="s" fill="#6a4e9b">夹层通风口 → 地下锅炉房捷径</text>
  </g>

  <!-- B1 -->
  <g>
    <rect x="1100" y="330" width="460" height="470" class="panel"/>
    <text x="1130" y="376" class="h">B1 · 配电与锅炉层</text>
    <text x="1130" y="402" class="s">总目标：恢复供电、蒸汽引鬼、找到火源</text>
    <rect x="1130" y="425" width="200" height="150" class="room-b"/>
    <text x="1230" y="455" class="t" text-anchor="middle">旧配电间</text>
    <text x="1230" y="480" class="s" text-anchor="middle">烧焦线束 / 时间标签</text>
    <text x="1230" y="500" class="s" text-anchor="middle">火灾前/后线路图</text>
    <rect x="1370" y="425" width="160" height="150" class="room-b"/>
    <text x="1450" y="455" class="t" text-anchor="middle">锅炉房</text>
    <text x="1450" y="480" class="s" text-anchor="middle">锅炉阀 / 蒸汽阀</text>
    <text x="1450" y="500" class="s" text-anchor="middle">煤斗 / 检修梯</text>
    <rect x="1130" y="610" width="400" height="170" class="room-b"/>
    <text x="1330" y="650" class="t" text-anchor="middle">消防仓库 / 失火原点</text>
    <text x="1330" y="675" class="s" text-anchor="middle">双笔槽 / 两张处分记录</text>
    <text x="1330" y="695" class="s" text-anchor="middle">真相：旧电线短路</text>
    <path class="route" d="M1230 575 L1230 610 L1330 610 M1450 575 L1450 610"/>
  </g>

  <!-- Section -->
  <g>
    <rect x="40" y="830" width="1520" height="480" class="panel"/>
    <text x="70" y="875" class="h">立体剖切：四层路线如何串起来</text>
    <g transform="translate(480,1030)">
      <polygon points="-420,120 420,120 340,-80 -340,-80" fill="#d8c7a6" stroke="#5a4d37"/>
      <polygon points="-340,-80 340,-80 340,-250 -340,-250" fill="#ccd3d7" stroke="#59616e"/>
      <polygon points="-420,120 -340,-80 -340,-250 -420,-50" fill="#a9b3b8" stroke="#59616e"/>
      <polygon points="340,-80 420,120 420,-50 340,-250" fill="#c3cbd0" stroke="#59616e"/>
      <text x="0" y="70" text-anchor="middle" class="t">B1 锅炉/配电</text>
      <text x="0" y="-70" text-anchor="middle" class="t">2F 办公室/档案阁</text>
      <text x="0" y="-220" text-anchor="middle" class="t">1F 保健室/迷宫</text>
      <path class="route" d="M-210 70 L-210 -80 L0 -180 L210 -80 L210 70"/>
    </g>
    <g transform="translate(950,880)">
      <text x="0" y="20" class="gold">垂直闭环</text>
      <text x="0" y="55" class="t">① 1F 保健室拿粉笔盒引鬼</text>
      <text x="0" y="85" class="t">② 2F 办公室读日程、拿红笔</text>
      <text x="0" y="115" class="t">③ 夹层通风口下到 B1</text>
      <text x="0" y="145" class="t">④ 配电箱接线 -> 锅炉蒸汽引鬼</text>
      <text x="0" y="175" class="t">⑤ 消防仓库双笔槽真相</text>
      <text x="0" y="215" class="s">鬼不会追进所有层：它按铃声逐层巡，玩家利用错层阅读。</text>
    </g>
  </g>

  <!-- Object sheet -->
  <g>
    <rect x="40" y="1340" width="1520" height="520" class="panel"/>
    <text x="70" y="1385" class="h">关键互动单体：拿到 = 全局规则变化</text>
    <g transform="translate(70,1430)">
      <rect width="345" height="180" rx="10" fill="#f2e7cf" stroke="#7d5a33"/>
      <text x="172" y="35" text-anchor="middle" class="gold">红笔</text>
      <text x="172" y="70" text-anchor="middle" class="s">拿到后：处分记录可改写</text>
      <text x="172" y="95" text-anchor="middle" class="s">程老师进入批改暴走</text>
      <text x="172" y="120" text-anchor="middle" class="s">出口锁定规则改变</text>
      <text x="172" y="150" text-anchor="middle" class="t">规则钥匙</text>
    </g>
    <g transform="translate(445,1430)">
      <rect width="345" height="180" rx="10" fill="#f2e7cf" stroke="#8f2f24"/>
      <text x="172" y="35" text-anchor="middle" class="gold">值日表</text>
      <text x="172" y="70" text-anchor="middle" class="s">读取后：全图日程可见</text>
      <text x="172" y="95" text-anchor="middle" class="s">玩家获得“预测程老师”能力</text>
      <text x="172" y="120" text-anchor="middle" class="s">门禁时间表写入手机</text>
      <text x="172" y="150" text-anchor="middle" class="t">观察能力</text>
    </g>
    <g transform="translate(820,1430)">
      <rect width="345" height="180" rx="10" fill="#efe3cc" stroke="#6a4e9b"/>
      <text x="172" y="35" text-anchor="middle" class="gold">小满的笔帽</text>
      <text x="172" y="70" text-anchor="middle" class="s">拿到后：档案阁新楼梯开放</text>
      <text x="172" y="95" text-anchor="middle" class="s">程老师会短暂停住回忆</text>
      <text x="172" y="120" text-anchor="middle" class="s">地下室捷径解锁</text>
      <text x="172" y="150" text-anchor="middle" class="t">关系钥匙</text>
    </g>
    <g transform="translate(1195,1430)">
      <rect width="345" height="180" rx="10" fill="#dce9da" stroke="#3f7f5a"/>
      <text x="172" y="35" text-anchor="middle" class="gold">锅炉阀/配电箱</text>
      <text x="172" y="70" text-anchor="middle" class="s">操作后：全楼供电改变</text>
      <text x="172" y="95" text-anchor="middle" class="s">蒸汽把程老师引到 B1</text>
      <text x="172" y="120" text-anchor="middle" class="s">1F/2F 出现安全窗口</text>
      <text x="172" y="150" text-anchor="middle" class="t">环境机关</text>
    </g>
  </g>

  <text x="40" y="1880" font-size="16" font-family="Microsoft YaHei" fill="#d8cbb4">确认后按此稿进入 V101 场景结构重构：房间/楼层/门禁数据化，再做红笔规则钥匙与铃循环。</text>
</svg>
