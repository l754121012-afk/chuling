<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1450" viewBox="0 0 1720 1450">
  <style>
    .bg{fill:#15161a;}
    .panel{fill:#f7f1e2;stroke:#5a4d37;stroke-width:2;}
    .h{font:bold 26px "Microsoft YaHei";fill:#2b2118;}
    .t{font:16px "Microsoft YaHei";fill:#4b4134;}
    .s{font:13px "Microsoft YaHei";fill:#4b4134;}
    .gold{font:bold 19px "Microsoft YaHei";fill:#b7791f;}
    .room{fill:#efe3cc;stroke:#8a6d3b;stroke-width:3;}
  </style>
  <rect class="bg" width="1720" height="1450"/>
  <text x="40" y="48" font-size="32" font-family="Microsoft YaHei" font-weight="700" fill="#ffe9b8">空间 01 · 门厅/值班室 · 三视角视觉稿</text>
  <text x="40" y="84" font-size="17" font-family="Microsoft YaHei" fill="#d8cbb4">第一安全区：进门一眼能看见失物招领、学生证墙、门禁铃、值班表；三条路线都从这里开始</text>

  <!-- Top -->
  <g>
    <rect x="34" y="110" width="540" height="600" class="panel"/>
    <text x="60" y="150" class="h">A · 俯视</text>
    <rect x="70" y="210" width="470" height="450" class="room"/>
    <rect x="230" y="645" width="110" height="28" fill="#fff" stroke="#59616e"/>
    <text x="285" y="695" text-anchor="middle" class="s">校舍入口</text>

    <!-- props -->
    <rect x="110" y="250" width="130" height="130" fill="#d6cba9" stroke="#7d5a33"/>
    <text x="175" y="320" text-anchor="middle" class="s">失物招领柜</text>
    <rect x="270" y="250" width="170" height="120" fill="#f4ead0" stroke="#5a4d37"/>
    <text x="355" y="310" text-anchor="middle" class="s">学生证墙</text>
    <circle cx="115" cy="450" r="24" fill="#c94f3d" stroke="#7d3f2c"/>
    <text x="115" y="455" text-anchor="middle" font-size="12" fill="#fff">铃</text>
    <text x="145" y="455" class="s">门禁铃</text>
    <rect x="250" y="430" width="160" height="130" fill="#f7e7c8" stroke="#8a6d3b"/>
    <text x="330" y="480" text-anchor="middle" class="t">值班桌</text>
    <rect x="290" y="500" width="70" height="18" fill="#8f2f24"/>
    <text x="325" y="516" text-anchor="middle" font-size="12" fill="#ffe9b8">钥匙</text>
    <rect x="440" y="430" width="80" height="130" fill="#cfd3d8" stroke="#59616e"/>
    <text x="480" y="500" text-anchor="middle" class="s">档案柜</text>
    <rect x="120" y="590" width="150" height="35" fill="#cfd3d8"/>
    <text x="195" y="613" text-anchor="middle" class="s">内门 -> 保健区</text>
    <rect x="390" y="590" width="110" height="35" fill="#cfd3d8"/>
    <text x="445" y="613" text-anchor="middle" class="s">楼梯 -> 二楼</text>
  </g>

  <!-- Player view -->
  <g>
    <rect x="590" y="110" width="540" height="600" class="panel"/>
    <text x="620" y="150" class="h">B · 玩家视角</text>
    <polygon points="710,280 1040,280 1120,700 630,700" fill="#ddd4c2" stroke="#5a4d37"/>
    <polygon points="710,280 1040,280 1040,700 710,700" fill="#d3cab7"/>

    <!-- notice wall -->
    <rect x="750" y="330" width="250" height="230" fill="#f4ead0" stroke="#5a4d37" stroke-width="4"/>
    <text x="875" y="445" text-anchor="middle" font-size="16" font-family="Microsoft YaHei">学生证墙</text>
    <rect x="800" y="470" width="150" height="60" fill="#fff" stroke="#7d5a33"/>
    <text x="875" y="505" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">值班表</text>

    <!-- lost cabinet -->
    <rect x="650" y="430" width="90" height="250" fill="#d6cba9" stroke="#7d5a33" stroke-width="3"/>
    <text x="695" y="570" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">失物</text>

    <!-- reception desk -->
    <polygon points="900,560 1080,560 1140,700 830,700" fill="#8a6d3b" stroke="#57401f" stroke-width="3"/>
    <text x="1000" y="650" text-anchor="middle" font-size="14" font-family="Microsoft YaHei" fill="#ffe9b8">值班桌</text>

    <!-- bell -->
    <circle cx="1120" cy="500" r="25" fill="#c94f3d" stroke="#7d3f2c" stroke-width="3"/>
    <text x="1120" y="508" text-anchor="middle" font-size="14" fill="#fff">铃</text>

    <text x="640" y="680" class="s">一眼阅读：学生证墙（身份线索）、失物柜（被没收物品）、值班铃（声音开关）、值班桌（钥匙）</text>
  </g>

  <!-- Objects -->
  <g>
    <rect x="34" y="730" width="820" height="650" class="panel"/>
    <text x="60" y="770" class="h">C · 互动单体</text>

    <g transform="translate(70,800)">
      <rect width="250" height="250" rx="10" fill="#f4d6d0" stroke="#8f2f24"/>
      <circle cx="125" cy="90" r="45" fill="#c94f3d" stroke="#7d3f2c" stroke-width="5"/>
      <text x="125" y="97" text-anchor="middle" font-size="24" fill="#fff">铃</text>
      <text x="125" y="220" text-anchor="middle" class="gold">门禁铃</text>
      <text x="125" y="245" text-anchor="middle" class="s">战斗：砸碎=全楼响</text>
    </g>
    <g transform="translate(360,800)">
      <rect width="250" height="250" rx="10" fill="#efe3cc" stroke="#7d5a33"/>
      <rect x="80" y="90" width="70" height="110" rx="8" fill="#f4a261" stroke="#7d3f2c"/>
      <circle cx="115" cy="75" r="18" fill="#8a6d3b"/>
      <text x="125" y="220" text-anchor="middle" class="gold">值班钥匙</text>
      <text x="125" y="245" text-anchor="middle" class="s">解谜：找到值班空档</text>
    </g>
    <g transform="translate(670,800)">
      <rect width="250" height="250" rx="10" fill="#f4ead0" stroke="#5a4d37"/>
      <rect x="45" y="40" width="160" height="160" fill="#fff" stroke="#5a4d37"/>
      <text x="125" y="120" text-anchor="middle" class="s">学生证/值班表</text>
      <text x="125" y="220" text-anchor="middle" class="gold">记录载体</text>
      <text x="125" y="245" text-anchor="middle" class="s">戏耍：调换红笔</text>
    </g>
  </g>

  <!-- approaches -->
  <g>
    <rect x="870" y="730" width="820" height="650" class="panel"/>
    <text x="900" y="770" class="h">D · 三流派与本关情绪</text>
    <g transform="translate(910,820)">
      <rect width="750" height="150" rx="12" fill="#f4d6d0" stroke="#8f2f24"/>
      <text x="20" y="40" class="gold">战斗流：砸门禁铃</text>
      <text x="20" y="75" class="s">全楼铃声把程老师引到门厅，自己从楼梯绕进二楼。</text>
      <text x="20" y="105" class="s">爽点：一次粗暴开门；代价：程老师从“巡逻”切“暴走”。</text>

      <rect x="0" y="180" width="750" height="150" rx="12" fill="#efe3cc" stroke="#7d5a33"/>
      <text x="20" y="220" class="gold">戏耍流：调换值班表/借钥匙</text>
      <text x="20" y="255" class="s">把程老师的下一站改成二楼资料室，制造空档偷走钥匙。</text>
      <text x="20" y="285" class="s">爽点：它对着空办公室登记时，玩家从它背后穿过。</text>

      <rect x="0" y="360" width="750" height="150" rx="12" fill="#e5d8ef" stroke="#6a4e9b"/>
      <text x="20" y="400" class="gold">解谜流：安静看值班表</text>
      <text x="20" y="435" class="s">从学生证墙认出小满，值班表最后一页是程老师的名字。</text>
      <text x="20" y="465" class="s">不触发任何声音，拿走“门禁空窗”记录。</text>

      <text x="0" y="570" class="gold">叙事验收</text>
      <text x="0" y="600" class="s">这里告诉玩家：程老师每天都自己值班；小满的学生证仍挂在失物处，从未被领走。</text>
    </g>
  </g>

  <text x="40" y="1410" font-size="15" font-family="Microsoft YaHei" fill="#d8cbb4">下一空间：保健室/禁闭区（已有俯视+玩家视角）；之后按门厅-保健-隔间-办公室-资料-夹层-锅炉-配电-仓库-内院-屋顶-记忆走廊-倒放-真相层继续。</text>
</svg>
