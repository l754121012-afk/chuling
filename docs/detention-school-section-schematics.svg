<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1560" viewBox="0 0 1720 1560">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffe9b8"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#141519;}
    .frame{fill:#f7f1e2;stroke:#5a4d37;stroke-width:2;}
    .h{font:bold 28px "Microsoft YaHei";fill:#2b2118;}
    .t{font:17px "Microsoft YaHei";fill:#4b4134;}
    .s{font:14px "Microsoft YaHei";fill:#4b4134;}
    .gold{font:bold 20px "Microsoft YaHei";fill:#b7791f;}
    .wall{fill:#cfd3d8;stroke:#59616e;stroke-width:2;}
    .room{fill:#f2e7cf;stroke:#7d5a33;stroke-width:2;}
    .room2{fill:#eee0d2;stroke:#9b5de5;stroke-width:2;}
    .roomB{fill:#e6e0d4;stroke:#59616e;stroke-width:2;}
  </style>
  <rect class="bg" width="1720" height="1560"/>
  <text x="40" y="44" font-size="34" font-family="Microsoft YaHei" font-weight="700" fill="#ffe9b8">禁闭室正式关 · 旧校舍西翼剖切示意图</text>
  <text x="40" y="80" font-size="17" font-family="Microsoft YaHei" fill="#d8cbb4">主图 = 四层剖切；右侧 = 45 分钟时间路线；所有垂直捷径与两支笔的故事点已标出</text>

  <!-- main section -->
  <g>
    <rect x="34" y="110" width="1260" height="1020" class="frame"/>
    <text x="60" y="150" class="h">A · 建筑剖切：屋顶 / 二楼 / 一楼 / 地下 / 室外</text>

    <!-- building outline -->
    <rect x="170" y="230" width="950" height="830" fill="#d7d0c0" stroke="#3a3126" stroke-width="4"/>
    <line x1="170" y1="470" x2="1120" y2="470" stroke="#3a3126" stroke-width="5"/>
    <line x1="170" y1="690" x2="1120" y2="690" stroke="#3a3126" stroke-width="5"/>
    <line x1="170" y1="940" x2="1120" y2="940" stroke="#3a3126" stroke-width="5"/>
    <line x1="170" y1="230" x2="1120" y2="230" stroke="#3a3126" stroke-width="5"/>

    <!-- roof level -->
    <g>
      <rect x="200" y="105" width="890" height="125" fill="#b9c4cf" stroke="#59616e" stroke-width="3"/>
      <rect x="250" y="120" width="170" height="90" class="room"/>
      <text x="335" y="160" class="s" text-anchor="middle">屋顶水箱/广播</text>
      <circle cx="750" cy="155" r="16" fill="#ffd166" stroke="#8a6d3b"/>
      <text x="750" y="185" text-anchor="middle" font-size="13" font-family="Microsoft YaHei">记忆铃</text>
    </g>

    <!-- 2F -->
    <g>
      <rect x="190" y="260" width="910" height="205" fill="#eadfca"/>
      <rect x="215" y="280" width="260" height="160" class="room"/>
      <text x="345" y="330" class="t" text-anchor="middle">教师办公室</text>
      <text x="345" y="360" class="s" text-anchor="middle">日程/处分印章</text>
      <circle cx="300" cy="425" r="10" fill="#8f2f24"/>
      <text x="300" y="453" text-anchor="middle" font-size="12" font-family="Microsoft YaHei" fill="#8f2f24">处分记录</text>

      <rect x="500" y="280" width="260" height="160" class="room"/>
      <text x="630" y="330" class="t" text-anchor="middle">资料室</text>
      <text x="630" y="360" class="s" text-anchor="middle">三份学生记录</text>
      <rect x="560" y="390" width="50" height="35" class="wall"/>
      <rect x="620" y="390" width="50" height="35" class="wall"/>
      <text x="630" y="422" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">档案柜</text>

      <rect x="790" y="270" width="280" height="180" fill="#e5d8ef" stroke="#6a4e9b" stroke-width="3"/>
      <text x="930" y="330" class="t" text-anchor="middle">档案阁夹层</text>
      <text x="930" y="360" class="s" text-anchor="middle">横梁/爬架</text>
      <rect x="850" y="390" width="120" height="14" fill="#8a6d3b"/>
      <text x="930" y="420" text-anchor="middle" font-size="13" font-family="Microsoft YaHei" fill="#4b3a8f">小满的笔帽</text>
    </g>

    <!-- 1F -->
    <g>
      <rect x="190" y="490" width="910" height="195" fill="#f2e7cf"/>
      <rect x="215" y="510" width="210" height="160" class="room"/>
      <text x="320" y="555" class="t" text-anchor="middle">门厅/值班室</text>
      <text x="320" y="585" class="s" text-anchor="middle">门禁铃/失物招领</text>
      <rect x="300" y="650" width="24" height="14" fill="#59616e"/>

      <rect x="450" y="510" width="300" height="160" class="room"/>
      <text x="600" y="555" class="t" text-anchor="middle">保健室/禁闭区</text>
      <text x="600" y="585" class="s" text-anchor="middle">病床/粉笔盒/可开合隔间</text>
      <text x="600" y="620" class="s" text-anchor="middle">旧值日镜</text>
      <circle cx="750" cy="620" r="12" fill="#9b5de5"/>

      <rect x="775" y="510" width="300" height="160" class="room"/>
      <text x="925" y="555" class="t" text-anchor="middle">禁闭隔间迷宫</text>
      <text x="925" y="585" class="s" text-anchor="middle">推挡板改变开合方向</text>
      <rect x="820" y="610" width="60" height="30" class="wall"/>
      <rect x="920" y="610" width="60" height="30" class="wall"/>
      <text x="925" y="660" text-anchor="middle" font-size="13" font-family="Microsoft YaHei">小满的圆珠笔</text>
    </g>

    <!-- B1 -->
    <g>
      <rect x="190" y="720" width="910" height="215" fill="#e4ded3"/>
      <rect x="215" y="745" width="250" height="175" class="roomB"/>
      <text x="340" y="800" class="t" text-anchor="middle">地下锅炉房</text>
      <text x="340" y="835" class="s" text-anchor="middle">蒸汽阀/锅炉重启</text>
      <rect x="260" y="865" width="80" height="40" fill="#7a4b2e" stroke="#4b301a"/>
      <text x="300" y="890" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">锅炉</text>

      <rect x="500" y="745" width="250" height="175" class="roomB"/>
      <text x="625" y="800" class="t" text-anchor="middle">旧配电间</text>
      <text x="625" y="835" class="s" text-anchor="middle">火灾前后线路图</text>
      <circle cx="625" cy="880" r="11" fill="#e63946"/>
      <text x="625" y="908" text-anchor="middle" font-size="12" font-family="Microsoft YaHei" fill="#8f2f24">起火源头</text>

      <rect x="785" y="745" width="290" height="175" class="roomB"/>
      <text x="930" y="800" class="t" text-anchor="middle">消防仓库/失火原点</text>
      <text x="930" y="835" class="s" text-anchor="middle">倒放世界入口</text>
      <rect x="860" y="865" width="80" height="35" fill="#8a6d3b"/>
      <text x="900" y="888" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">旧档案</text>
    </g>

    <!-- exterior -->
    <g>
      <rect x="110" y="970" width="1020" height="130" fill="#c9d3bc" stroke="#59616e"/>
      <rect x="190" y="990" width="220" height="90" class="room"/>
      <text x="300" y="1030" class="t" text-anchor="middle">内院</text>
      <text x="300" y="1060" class="s" text-anchor="middle">消防梯/垃圾箱/落水管</text>
      <rect x="500" y="990" width="220" height="90" class="room"/>
      <text x="610" y="1030" class="t" text-anchor="middle">校舍外墙通道</text>
      <text x="610" y="1060" class="s" text-anchor="middle">火灾伤疤可见</text>
    </g>

    <!-- vertical paths -->
    <g stroke="#ffd166" stroke-width="5" fill="none" stroke-dasharray="10 8">
      <path d="M1120 600 L1220 600 L1220 200 L1160 180" marker-end="url(#a)"/>
      <path d="M1110 930 L1180 930 L1180 490 L1160 460" marker-end="url(#a)"/>
      <path d="M1120 850 L1250 850 L1250 700 L1190 700"/>
      <path d="M250 940 L250 820 L330 820 L330 740 L250 740 L250 470 L300 470 L300 390 L360 390 L360 350 L280 350 L280 270 L240 240" marker-end="url(#a)"/>
    </g>
    <text x="1140" y="450" font-size="14" font-family="Microsoft YaHei" fill="#b7791f">消防梯外挂</text>
    <text x="1170" y="740" font-size="14" font-family="Microsoft YaHei" fill="#b7791f">锅炉排风</text>
    <text x="170" y="430" font-size="14" font-family="Microsoft YaHei" fill="#b7791f">档案阁垂直爬道</text>
  </g>

  <!-- timeline panel -->
  <g>
    <rect x="1310" y="110" width="390" height="700" class="frame"/>
    <text x="1335" y="150" class="h">B · 45 分钟路线</text>
    <g transform="translate(1340,175)">
      <rect width="330" height="105" rx="8" fill="#f2e7cf" stroke="#7d5a33"/>
      <text x="15" y="32" class="gold">08:00-08:15 · 一楼</text>
      <text x="15" y="58" class="s">门厅观察 -> 值班室 -> 禁闭隔间</text>
      <text x="15" y="82" class="s">用粉笔声引开程老师</text>
    </g>
    <g transform="translate(1340,305)">
      <rect width="330" height="105" rx="8" fill="#efe0ef" stroke="#9b5de5"/>
      <text x="15" y="32" class="gold">08:20-08:35 · 二楼</text>
      <text x="15" y="58" class="s">偷看日程 -> 资料室对照记录</text>
      <text x="15" y="82" class="s">爬档案阁拿到笔帽</text>
    </g>
    <g transform="translate(1340,435)">
      <rect width="330" height="105" rx="8" fill="#e6e0d4" stroke="#59616e"/>
      <text x="15" y="32" class="gold">08:40-08:55 · 地下</text>
      <text x="15" y="58" class="s">锅炉重启 -> 配电间接线</text>
      <text x="15" y="82" class="s">消防仓库触发倒放世界</text>
    </g>
    <g transform="translate(1340,565)">
      <rect width="330" height="105" rx="8" fill="#f4d6d0" stroke="#8f2f24"/>
      <text x="15" y="32" class="gold">09:00+ · 屋顶/真相</text>
      <text x="15" y="58" class="s">程老师最后巡视屋顶</text>
      <text x="15" y="82" class="s">两支笔配对 -> 下课铃真响</text>
    </g>
  </g>

  <!-- mechanics panel -->
  <g>
    <rect x="1310" y="830" width="390" height="300" class="frame"/>
    <text x="1335" y="870" class="h">C · 故事/玩法密码</text>
    <text x="1340" y="905" class="t">小满的笔 = 钥匙</text>
    <text x="1340" y="932" class="s">笔帽在档案阁 / 笔身在禁闭隔间</text>
    <text x="1340" y="970" class="t">程老师的处分记录 = 循环</text>
    <text x="1340" y="997" class="s">粉笔改规则 = 重写他不敢改的事</text>
    <text x="1340" y="1035" class="t">火灾前/后倒放 = 真相</text>
    <text x="1340" y="1062" class="s">配电间告诉玩家不是纵火</text>
    <text x="1340" y="1100" class="gold">爽点验收</text>
    <text x="1340" y="1126" class="s">每层至少 3 条路线/一次引鬼连锁</text>
  </g>

  <text x="50" y="1160" font-size="17" font-family="Microsoft YaHei" fill="#d8cbb4">确认点：建筑比例/楼层数/垂直捷径/时间表是否足够；下阶段按此细化每一层互动单体与三视角设定图。</text>
</svg>
