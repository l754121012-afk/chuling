<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f2f24"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #16181d; }
    .panel { fill: #f6f1e4; stroke: #4b4134; stroke-width: 2; }
    .phead { font: bold 26px "Microsoft YaHei", sans-serif; fill: #2b2118; }
    .sub { font: 17px "Microsoft YaHei", sans-serif; fill: #4b4134; }
    .small { font: 14px "Microsoft YaHei", sans-serif; fill: #4b4134; }
    .red { fill: #c94f3d; }
    .wood { fill: #c39a6b; stroke: #7d5a33; }
    .darkwood { fill: #8a6d3b; stroke: #57401f; }
    .wall { fill: #cfd3d8; stroke: #59616e; }
    .line { stroke: #59616e; stroke-width: 1.5; fill: none; }
    .label { font: 15px "Microsoft YaHei", sans-serif; }
  </style>

  <rect class="bg" width="1600" height="1150"/>
  <text x="40" y="46" class="phead" fill="#ffe9b8" font-size="30">禁闭室怪谈 · 场景视觉示意（确认稿）</text>
  <text x="40" y="78" class="sub" fill="#d8cbb4">旧保健室改造禁闭室：解密 + 轻战斗 + 1.5 倍当前教室面积 · 未开始实现</text>

  <!-- A 平面图 -->
  <g>
    <rect x="34" y="108" width="760" height="545" class="panel"/>
    <text x="58" y="146" class="phead">A · 俯视平面图</text>
    <text x="58" y="172" class="sub">约 20m × 14m · 旧保健室墙内空间</text>

    <rect x="120" y="210" width="590" height="380" fill="#efe3cc" stroke="#8f8270" stroke-width="4"/>
    <!-- walls -->
    <rect x="110" y="200" width="610" height="15" class="wall"/>
    <rect x="110" y="590" width="140" height="15" class="wall"/>
    <rect x="420" y="590" width="290" height="15" class="wall"/>
    <rect x="110" y="200" width="15" height="405" class="wall"/>
    <rect x="695" y="200" width="15" height="405" class="wall"/>
    <text x="695" y="385" class="small" transform="rotate(-90 695 385)">东墙旧储物柜</text>

    <!-- windows -->
    <g>
      <rect x="180" y="196" width="180" height="24" fill="#bfe3ea" stroke="#3f7fa6"/>
      <rect x="420" y="196" width="180" height="24" fill="#bfe3ea" stroke="#3f7fa6"/>
      <text x="270" y="233" class="small" text-anchor="middle">北窗（封条）</text>
      <text x="510" y="233" class="small" text-anchor="middle">北窗（封条）</text>
    </g>
    <!-- blackboard -->
    <rect x="170" y="255" width="280" height="120" fill="#5d6b5a" stroke="#2f3a30" stroke-width="3"/>
    <text x="310" y="318" class="label" fill="#d9e0d2" text-anchor="middle">旧黑板（值日表）</text>
    <rect x="152" y="370" width="330" height="28" fill="#7b5a34" stroke="#4b301a" stroke-width="2"/>
    <text x="317" y="389" class="small" text-anchor="middle">粉笔槽 / 粉笔盒</text>

    <!-- movable partitions/desks -->
    <g fill="#d9b98d" stroke="#8a6d3b" stroke-width="2">
      <rect x="500" y="260" width="70" height="55" class="wood"/>
      <rect x="580" y="260" width="70" height="55" class="wood"/>
      <rect x="500" y="340" width="70" height="55" class="wood"/>
      <rect x="580" y="340" width="70" height="55" class="wood"/>
    </g>
    <text x="585" y="420" class="small" text-anchor="middle">值班桌与推拉挡板</text>

    <!-- center isolation desk -->
    <g>
      <rect x="300" y="430" width="150" height="70" fill="#b56b4f" stroke="#7d3f2c" stroke-width="3"/>
      <text x="375" y="468" class="small" text-anchor="middle" fill="#fff2df">禁闭桌（中心）</text>
    </g>

    <!-- ghost prop / old bed -->
    <g>
      <rect x="135" y="480" width="140" height="60" class="darkwood"/>
      <text x="205" y="516" class="small" text-anchor="middle">旧病床（可钻）</text>
    </g>

    <!-- item points -->
    <g stroke="#8f2f24" stroke-width="2">
      <circle cx="317" cy="385" r="8" fill="#fff" marker-end="url(#arr)"/>
      <text x="410" y="360" class="label red">A 粉笔盒</text>
      <text x="410" y="380" class="small">制造粉笔声的机关</text>

      <circle cx="677" cy="330" r="8" fill="#fff"/>
      <text x="606" y="302" class="label red">B 墙边旧电话</text>
      <text x="606" y="320" class="small">第二声“响铃移动”</text>

      <circle cx="145" cy="330" r="8" fill="#fff"/>
      <text x="40" y="340" class="label red">C 旧值日镜</text>
      <text x="40" y="360" class="small">照出隐藏值日规则</text>

      <circle cx="420" cy="560" r="8" fill="#fff"/>
      <text x="470" y="566" class="label red">D 禁闭登记本</text>
    </g>

    <!-- ghost path -->
    <path d="M260 400 C200 470 230 520 300 520 C390 520 430 470 520 470 C590 470 620 400 560 360" class="line" stroke="#9b5de5" stroke-dasharray="8 6" stroke-width="3"/>
    <text x="450" y="510" class="small" fill="#9b5de5">鬼只会在“粉笔声/铃声”后移动</text>

    <text x="128" y="612" class="small">南门（出口）：完成“心结三问”后开锁</text>
  </g>

  <!-- B 立体示意 -->
  <g>
    <rect x="820" y="108" width="760" height="545" class="panel"/>
    <text x="848" y="146" class="phead">B · 立体/透视示意图</text>
    <text x="848" y="172" class="sub">低视角：黑板在前，中心禁闭桌，后区储物与病床</text>

    <g transform="translate(1050,430)">
      <polygon points="-250,120 250,120 180,-60 -180,-60" fill="#d8c7a6" stroke="#6a5a40"/>
      <polygon points="-180,-60 -250,120 -250,-90 -180,-210" fill="#a9b3b8" stroke="#59616e"/>
      <polygon points="180,-60 250,120 250,-90 180,-210" fill="#bdc5ca" stroke="#59616e"/>
      <polygon points="-180,-60 180,-60 180,-210 -180,-210" fill="#ccd3d7" stroke="#59616e"/>
      <rect x="-160" y="-185" width="280" height="65" fill="#5d6b5a" stroke="#2f3a30"/>
      <text x="-20" y="-145" fill="#d9e0d2" font-size="13" font-family="Microsoft YaHei">黑板</text>
      <rect x="-120" y="-100" width="80" height="80" fill="#b56b4f" stroke="#7d3f2c"/>
      <rect x="-20" y="-100" width="80" height="80" fill="#b56b4f" stroke="#7d3f2c"/>
      <text x="-20" y="-50" text-anchor="middle" font-size="13" font-family="Microsoft YaHei">禁闭桌</text>
      <rect x="100" y="-70" width="60" height="90" fill="#c39a6b" stroke="#7d5a33"/>
      <rect x="70" y="-55" width="22" height="75" fill="#8a6d3b"/>
      <text x="70" y="-8" font-size="12" font-family="Microsoft YaHei">柜</text>
      <rect x="-170" y="-10" width="80" height="30" fill="#8a6d3b"/>
      <text x="-130" y="10" text-anchor="middle" font-size="12" font-family="Microsoft YaHei">病床</text>
      <line x1="-100" y1="90" x2="120" y2="90" stroke="#9b5de5" stroke-dasharray="6 6" stroke-width="2"/>
    </g>
    <text x="925" y="590" class="small">红框区域 = 鬼的巡逻与移动范围；可钻/可躲：桌底、病床下、储物柜夹缝</text>
  </g>

  <!-- C 互动物体 -->
  <g>
    <rect x="34" y="680" width="760" height="430" class="panel"/>
    <text x="58" y="718" class="phead">C · 互动单体设定（1）</text>

    <!-- A chalk box -->
    <g transform="translate(120,740)">
      <rect x="0" y="50" width="120" height="60" fill="#9aa7ad" stroke="#59616e" stroke-width="2"/>
      <line x1="0" y1="78" x2="120" y2="78" stroke="#59616e"/>
      <g fill="#f4f2ea" stroke="#8f8270">
        <rect x="30" y="28" width="8" height="48"/>
        <rect x="50" y="20" width="8" height="56"/>
        <rect x="70" y="32" width="8" height="44"/>
      </g>
      <text x="60" y="145" class="label" text-anchor="middle">A 粉笔盒</text>
      <text x="60" y="165" class="small" text-anchor="middle">按 E 摇动 → 粉笔断裂声</text>
      <text x="60" y="184" class="small" text-anchor="middle">鬼被声音牵引移动一格</text>
    </g>

    <!-- B phone -->
    <g transform="translate(330,735)">
      <rect x="40" y="10" width="90" height="30" fill="#6a7480"/>
      <rect x="30" y="35" width="110" height="75" fill="#4a5560" stroke="#2c343d"/>
      <circle cx="55" cy="50" r="7" fill="#c94f3d"/>
      <circle cx="55" cy="78" r="7" fill="#c94f3d"/>
      <rect x="45" y="95" width="70" height="18" rx="5" fill="#2c343d"/>
      <text x="85" y="145" class="label" text-anchor="middle">B 墙边旧电话</text>
      <text x="85" y="165" class="small" text-anchor="middle">响铃会触发鬼短暂冲刺</text>
    </g>

    <!-- C mirror -->
    <g transform="translate(540,740)">
      <rect x="50" y="0" width="95" height="125" rx="8" fill="#bfe3ea" stroke="#8f6b35" stroke-width="8"/>
      <text x="97" y="55" class="small" text-anchor="middle" fill="#4b4134">值日镜</text>
      <text x="97" y="76" class="small" text-anchor="middle" fill="#4b4134">“它看着你”</text>
      <text x="97" y="160" class="label" text-anchor="middle">C 旧值日镜</text>
      <text x="97" y="180" class="small" text-anchor="middle">背面出现规则提示</text>
    </g>
  </g>

  <g>
    <rect x="820" y="680" width="760" height="430" class="panel"/>
    <text x="848" y="718" class="phead">D · 互动单体设定（2）</text>

    <!-- D log -->
    <g transform="translate(900,740)">
      <rect x="0" y="55" width="200" height="20" fill="#8a6d3b"/>
      <rect x="30" y="20" width="140" height="80" rx="4" fill="#fff8e6" stroke="#4b4134"/>
      <line x1="45" y1="42" x2="155" y2="42" stroke="#4b4134"/>
      <line x1="45" y1="58" x2="135" y2="58" stroke="#8f8270"/>
      <line x1="45" y1="74" x2="145" y2="74" stroke="#8f8270"/>
      <text x="100" y="160" class="label" text-anchor="middle">D 禁闭登记本</text>
      <text x="100" y="180" class="small" text-anchor="middle">三张纸 = 三个心结问题</text>
    </g>

    <!-- ghost rule -->
    <g transform="translate(1180,735)">
      <rect x="0" y="0" width="230" height="190" rx="10" fill="#2b2633" stroke="#9b5de5"/>
      <text x="115" y="36" class="label" text-anchor="middle" fill="#e6d8ff">行为规则（视觉化）</text>
      <text x="20" y="72" class="small" fill="#ffe9b8">安静：鬼缓慢巡逻</text>
      <text x="20" y="100" class="small" fill="#ffd166">粉笔声：鬼向下一个检查点移动</text>
      <text x="20" y="128" class="small" fill="#ff8fa3">电话响：鬼冲刺一小段</text>
      <text x="20" y="156" class="small" fill="#8ef0c8">心结三问完成：它停下来</text>
      <text x="115" y="230" text-anchor="middle" font-size="16" font-family="Microsoft YaHei" fill="#ffe9b8">需要你确认的核心循环</text>
    </g>
  </g>

  <text x="40" y="1140" fill="#d8cbb4" font-size="16" font-family="Microsoft YaHei">确认点：1) 房间尺寸/门窗方向 2) A/B/C/D 点位 3) 鬼“粉笔声才移动”规则 4) 可钻可躲位是否够</text>
</svg>
